/* タブの見出しの下に置く共有の操作（変数・力の表示・速度の表示・記号） */
.modebar{display:flex;flex-wrap:wrap;gap:.5em .9em;align-items:center;margin:0 0 12px;padding:.5em .9em;background:#fff;border:1px solid var(--line);border-radius:10px}
.modebar .varbox{margin-left:0;flex:0 1 auto;min-width:260px}
.modebar .lbl{font-size:.82rem;color:var(--sub);font-weight:700}
.modebar button.tiny{font-size:.86rem;padding:.3em .8em}
.modebar button.tiny.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
@media(max-width:520px){button.b.play{font-size:.9rem;min-width:6.8em;padding:.36em .7em}
  .row1 button.b{font-size:.8rem;padding:.3em .55em}
  .row1 button.b.sm{white-space:normal;text-align:left;line-height:1.35;padding:.34em .6em}}
.sl{display:flex;align-items:center;gap:.3em;font-size:.78rem;color:#9aa4ae}
.sl input[type=range]{width:88px;height:14px;accent-color:#b9c2cc}

/* スライドバーの箱（ボタン列の右） */
.varbox{flex:0 1 auto;margin-left:0;display:flex;flex-direction:column;gap:.3em;padding:.4em .7em;border:1px solid #e0e6ec;border-radius:10px;background:#fbfcfd;min-width:230px}
@media(max-width:560px){.varbox{margin-left:0;flex:1 1 100%;min-width:0}}
.vrow{display:flex;align-items:center;gap:.45em;font-size:.86rem}
.vrow .vl{font-weight:700;min-width:4.6em;color:#31465e}
.vrow .vl .katex{font-size:1em}
.vrow input[type=range]{flex:1 1 90px;min-width:70px;accent-color:var(--accent)}
.vrow .vv{font-variant-numeric:tabular-nums;min-width:3.6em;text-align:center;font-weight:700;color:var(--ink);font-size:.9rem}
/* スライドバーの右の −／＋ ボタン（1 目盛りずつ変える） */
button.tiny.nudge{font-size:.95rem;line-height:1;padding:.18em .45em;min-width:1.9em;font-weight:700;color:#31465e;border:1px solid #cdd6df;border-radius:7px;background:#fff}
button.tiny.nudge:hover{background:#eef3f8;border-color:#9fb2c4}
.vrow.ticks{margin-top:-.25em;font-size:.72rem;color:#8b96a2;justify-content:space-between;padding-left:5.1em;padding-right:6em}
.mrow{display:flex;align-items:center;gap:.35em;font-size:.82rem;color:#5b6672;flex-wrap:wrap}
.mrow .ml{font-weight:700;margin-right:.2em}
.mrow button.tiny{font-size:.84rem;padding:.22em .8em}
.mrow button.tiny.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.patrow{display:flex;flex-wrap:wrap;gap:.35em;margin:0 0 .5em}
.patrow button.b{font-size:.84rem}
.patrow button.b .katex{font-size:1em}

.msgbox{margin:.55em 0 .2em;padding:.45em .7em;border-radius:8px;background:#f2f6fa;border:1px solid #dbe4ee;font-size:.9rem;
  display:flex;align-items:center;overflow:hidden}
.msgbox.empty{background:#fafbfc;border-style:dashed;border-color:#e6eaef;color:#b9c2cc}
.readout{font-size:.66rem;color:#a2acb6;margin-top:.4em;font-variant-numeric:tabular-nums;line-height:1.55}
.readout .cell{display:inline-block;margin-right:.75em}
.readout .v{display:inline-block;min-width:3.8em;text-align:right}
.readout .v2{display:inline-block;min-width:4.4em;text-align:right}

/* ---- 立式 ---- */
.eqzone{margin:.7em 0 .2em;border:1px solid #e0e6ec;border-radius:10px;background:#fff;padding:.5em .8em .6em}
.eqzone.wait{background:#fafbfc;border-style:dashed;color:#b9c2cc;font-size:.88rem}
.eqzone .eqt{font-weight:700;font-size:.9rem;color:#31465e;margin:.2em 0 .1em}
.eqzone .eqt .bd{display:inline-block;background:var(--ink);color:#fff;border-radius:5px;padding:0 .5em;font-size:.8rem;margin-right:.45em}
.eqzone .eql{overflow-x:auto;padding:.05em 0}
.eqzone .eql .katex-display{margin:.25em 0}
.eqzone .eqn{font-size:.86rem;color:var(--sub);margin:.05em 0 .3em}
.eqzone .eqok{display:inline-block;font-size:.8rem;font-weight:700;color:var(--ok);border:1px solid #9bd6b2;background:#eaf7ef;border-radius:999px;padding:0 .6em;margin-left:.4em}
.eqzone .eqng{display:inline-block;font-size:.8rem;font-weight:700;color:var(--ng);border:1px solid #e8a9a9;background:#fdeeee;border-radius:999px;padding:0 .6em;margin-left:.4em}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:2px 0}
.katex-display>.katex{white-space:normal}

/* ---- グラフ ---- */
.graphs{margin-top:.2em}
.graphs canvas{display:block;width:100%}
.gtitle{font-weight:700;font-size:.9rem;color:#31465e;margin:0 0 .3em}
.gsw{display:flex;flex-wrap:wrap;gap:.35em;align-items:center;font-size:.78rem;color:#9aa4ae;margin:0 0 .3em}
.gcap{font-size:.82rem;color:var(--sub);margin:.35em 0 .1em;line-height:1.5}
.note{margin:.8em 0 .2em;padding:.55em .85em;background:#f7faff;border:1px solid #cfe0f2;border-left:4px solid var(--accent2);border-radius:10px;font-size:.9rem;line-height:1.7}
.note b{color:#1c4f8f}
.note .ttl{font-weight:700;color:#31465e;margin:0 0 .15em}
.note ol{margin:.2em 0 0;padding-left:1.4em}
.note.wait{background:#fafbfc;border-color:#e6eaef;border-left-color:#c3ccd6;color:#b9c2cc}

/* ---- 穴うめの確認（斜めの衝突） ---- */
.fill{margin:.35em 0 .1em;padding:.2em .8em;background:#fffdf5;border:1px solid #efe1b5;border-radius:10px;font-size:1rem}
.fill .ft{font-weight:700;font-size:.9rem;color:#8a6100;margin:0 0 .3em}
.fill .fl{margin:.1em 0;display:flex;align-items:center;flex-wrap:wrap;gap:.3em;line-height:1.5}
.fill .blank{display:inline-block;min-width:3.2em;text-align:center;font:inherit;border:1.5px solid #e0b64a;background:#fff8dc;border-radius:6px;padding:.05em .5em;cursor:pointer;color:#8a6100;font-weight:700}
.fill .blank.open{background:#eaf7ef;border-color:#5fb886;color:#14683a}
.fill .blank .katex{font-size:1.05em}

/* ---- 3コマ図・拡大 ---- */
.stagebox{margin:.7em 0 .2em;border:1px solid #e0e6ec;border-radius:10px;background:#fff;padding:.4em .2em .2em}
.stagetitle{font-size:.86rem;color:var(--sub);font-weight:700;margin:.1em 0 .1em .7em}
.stagescroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.stagebox canvas{display:block}
.zoomlay{position:fixed;inset:0;z-index:9999;pointer-events:none}
.zoomlay.hidden{display:none}
.zoomlay canvas{position:absolute;background:#fff;border:1.5px solid #b9c6d4;border-radius:12px;box-shadow:0 10px 34px rgba(20,30,45,.28)}
.stagebox.zoomable{cursor:zoom-in}
.zhint{margin-left:.7em;font-size:.72rem;font-weight:400;color:#9aa5b1}
@media(hover:none){.zhint{font-size:0}.zhint::after{content:"🔍 タップで拡大";font-size:.72rem}}

footer{color:var(--sub);font-size:.85rem;text-align:center;margin-top:30px}
.pagenav{margin:20px 0 6px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.navtop{font:inherit;font-size:.8rem;color:var(--sub);background:#fff;border:1px solid var(--line);
  border-radius:999px;padding:.3em 1em;cursor:pointer;text-decoration:none;transition:.12s}
.navtop:hover{background:#f0f5fb;border-color:#b9c9dd;text-decoration:none}

/* ===== スマートフォン向けの調整 ===== */
@media(max-width:560px){
  body{font-size:15px}
  .wrap{padding:14px 10px 64px}
  h1{font-size:1.2rem}
  h2{font-size:1.02rem}
  .katex-display{overflow-x:auto; overflow-y:hidden; padding-bottom:.2em}
  .stagebox::after{content:"→ 図は横にスクロールできます（指でスワイプ）";display:block;font-size:.72rem;color:#9aa4ae;margin:.35em 0 0}
  button.tiny{font-size:.82rem; padding:.35em .8em}
}

/* ===== コンテンツ一覧（第 24 回・rigid-body-dynamics と同じ見た目） ===== */
.wrap{position:relative}
.introrow{display:flex;align-items:stretch;gap:14px}
.introrow > .lead2{flex:0 1 auto;margin:.1em 0 .4em}
.tocbtn{flex:0 0 auto;align-self:stretch;min-height:3.2em;padding:6px 16px;border-radius:12px;font:inherit;font-size:.9rem;font-weight:700;
  cursor:pointer;background:#fff;color:var(--accent);border:1.5px solid var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.10)}
.tocbtn:hover{background:#fff3e3}
.tocpanel{position:absolute;z-index:60;left:50%;transform:translateX(-50%);top:70px;width:min(640px,calc(100vw - 24px));
  max-height:calc(100vh - 100px);overflow:auto;background:#fff;border:1px solid #c3ccd6;border-radius:14px;
  box-shadow:0 12px 40px rgba(0,0,0,.22);padding:10px 16px 14px}
.tocpanel[hidden]{display:none}
.tochead{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:6px;font-size:1rem}
.tocx{font:inherit;background:none;border:none;color:var(--sub);font-size:1.3rem;line-height:1;padding:2px 8px;cursor:pointer}
.tocmode{font-weight:800;color:#1f3b57;margin:10px 0 2px;font-size:.95rem}
.tocpanel ul{margin:0;padding-left:1.1em}
.tocpanel li{margin:2px 0;font-size:.88rem}
.tocpanel li.tocsub{margin-left:1.2em;font-size:.82rem;list-style:circle}
.tocpanel a{color:#0f4c8f;text-decoration:none}
.tocpanel a:hover{text-decoration:underline}
@media(max-width:640px){
  .introrow{flex-direction:column;gap:6px}
  .tocbtn{min-height:0;align-self:flex-start}
}

/* =========================================================================
   デザイン試作（2026-10）：「物理のノート × 科学誌」
   ・紙の地（あたたかい白）＋墨（ほぼ黒）＋ 1 色のアクセント（オレンジ）だけ。
     A＝赤・B＝青・力積＝マゼンタなど「図の中の色」は物理の約束なので変えない。
   ・ラテン文字と数字は KaTeX_Main（内蔵済みの Computer Modern）で、教科書・論文の雰囲気を出す。
   ・枠線で囲まず、余白と面の色で区切る。
   ========================================================================= */
:root{
  --paper:#f5f3ee; --paper-2:#ede9e1; --paper-3:#e4dfd5; --surface:#ffffff;
  --ink:#14171c; --ink-2:#3a414c; --ink-3:#69717d; --ink-4:#9aa1ab;
  --rule:#e6e1d7; --rule-2:#d5cfc3;
  --brand:#e07b18; --brand-600:#c9670c; --brand-700:#9c4e06; --brand-50:#fdf4e8; --brand-100:#fae4c8;
  --night:#0e1115; --night-2:#161a20; --night-rule:rgba(255,255,255,.09);
  --r-s:10px; --r:14px; --r-l:20px; --r-xl:28px;
  --sh-1:0 1px 2px rgba(20,23,28,.05);
  --sh-2:0 1px 2px rgba(20,23,28,.04),0 12px 32px -12px rgba(20,23,28,.14);
  --sh-3:0 30px 80px -20px rgba(14,17,21,.38),0 4px 14px rgba(14,17,21,.08);
  --ease:cubic-bezier(.2,.75,.2,1);
  --f-jp:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic Medium","Yu Gothic",YuGothic,"Noto Sans JP","Noto Sans CJK JP",Meiryo,system-ui,sans-serif;
  --f-jph:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP","Noto Sans CJK JP",Meiryo,system-ui,sans-serif;
  --f-serif:"KaTeX_Main","Times New Roman",serif;
  --f-mono:"KaTeX_Typewriter",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --navh:58px;
  /* 古い変数も新しい色にそろえる */
  --bg:var(--paper); --card:var(--surface); --sub:var(--ink-3); --line:var(--rule); --accent:var(--brand); --panel:#faf8f4;
}
html{scroll-padding-top:calc(var(--navh) + 12px)}
body{background:var(--paper);color:var(--ink);font-family:var(--f-jp);font-size:16px;line-height:1.8;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"palt" 0;text-rendering:optimizeLegibility}
::selection{background:var(--brand-100);color:var(--ink)}
:focus-visible{outline:3px solid rgba(224,123,24,.55);outline-offset:2px;border-radius:8px}
a{color:inherit}
h1,h2,h3{font-family:var(--f-jph)}

/* ---------- ヒーロー ---------- */
.hero{position:relative;background:var(--night);color:#f3efe6;overflow:hidden;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-2;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:40px 40px;background-position:-1px -1px;
  -webkit-mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,#000 30%,transparent 100%);mask-image:radial-gradient(ellipse 85% 75% at 50% 40%,#000 30%,transparent 100%)}
.hero::after{content:"";position:absolute;z-index:-1;width:1100px;height:700px;left:50%;top:38%;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(224,123,24,.20),rgba(224,123,24,.06) 55%,transparent 75%);filter:blur(10px);pointer-events:none}
.hero-in{position:relative;max-width:1240px;margin:0 auto;padding:28px 24px 34px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.kicker{margin:0;display:flex;align-items:center;gap:12px;font-size:.8rem;letter-spacing:.14em;color:rgba(243,239,230,.62);font-weight:600}
.kicker .kdot{width:4px;height:4px;border-radius:50%;background:var(--brand)}
.kicker .en{font-family:var(--f-serif);font-style:italic;letter-spacing:.04em;font-weight:400;font-size:.95rem;color:rgba(243,239,230,.55)}
.hero-title{margin:clamp(26px,5vw,58px) 0 0;line-height:1.08;font-weight:800;letter-spacing:-.025em;color:#f6f2e9}
.hero-title .t1{display:block;font-size:clamp(2.2rem,6.4vw,5.1rem)}
.hero-title .t2{display:block;margin-top:.55em;font-size:clamp(1.05rem,2.1vw,1.55rem);font-weight:600;letter-spacing:.02em;color:var(--brand)}
.hero .introrow{margin-top:22px;gap:22px;align-items:stretch;max-width:980px}
.hero .lead2{margin:0;font-size:clamp(.95rem,1.25vw,1.06rem);line-height:1.9;color:rgba(243,239,230,.78);max-width:46em}
.hero .tocbtn{min-height:3.2em;align-self:stretch;display:inline-flex;align-items:center;gap:.6em;padding:0 22px;border-radius:12px;
  font-family:var(--f-jph);font-size:.92rem;font-weight:700;letter-spacing:.04em;
  color:#1a1206;background:var(--brand);border:0;box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 10px 30px -10px rgba(224,123,24,.65);
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .18s}
.hero .tocbtn:hover{background:#f08c2a;transform:translateY(-1px);box-shadow:0 14px 34px -10px rgba(224,123,24,.8)}
.hero .tocbtn:active{transform:translateY(0)}
.tocbtn .ti{width:14px;height:11px;display:inline-block;background:
  linear-gradient(currentColor,currentColor) 0 0/100% 2px no-repeat,
  linear-gradient(currentColor,currentColor) 0 50%/72% 2px no-repeat,
  linear-gradient(currentColor,currentColor) 0 100%/86% 2px no-repeat}

/* 全体スイッチ（式・考え方／K–t 図） */
.hero .topbtns{display:flex;gap:8px;flex-wrap:wrap;margin:0}
.hero .topbtns button{display:inline-flex;align-items:center;gap:10px;font:inherit;font-family:var(--f-jph);font-size:.8rem;font-weight:600;
  padding:7px 14px 7px 8px;border-radius:999px;cursor:pointer;color:#f3efe6;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.12);box-shadow:none;transition:background .18s,border-color .18s}
.hero .topbtns button:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22)}
.hero .topbtns button.off{background:rgba(255,255,255,.03);color:rgba(243,239,230,.7);border-color:rgba(255,255,255,.1)}
.topbtns .sw{position:relative;width:32px;height:18px;border-radius:999px;background:rgba(255,255,255,.18);flex:0 0 auto;transition:background .2s}
.topbtns .sw i{position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .22s var(--ease);box-shadow:0 1px 3px rgba(0,0,0,.35)}
.topbtns button[aria-pressed="true"] .sw{background:var(--brand)}
.topbtns button[aria-pressed="true"] .sw i{transform:translateX(14px)}
.topbtns .swv{font-family:var(--f-serif);font-size:.78rem;letter-spacing:.06em;opacity:.7;min-width:2.2em}

/* ステージ（衝突のアニメーション） */
.stage{margin:34px 0 0;position:relative;border-radius:var(--r-l);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01));
  border:1px solid var(--night-rule);overflow:hidden}
.stage canvas{display:block;width:100%;height:clamp(200px,24vw,290px)}
.stagecap{display:flex;align-items:center;gap:10px;margin:0;padding:12px 18px 14px;border-top:1px solid var(--night-rule);
  font-size:.82rem;color:rgba(243,239,230,.62);line-height:1.6}
.stagecap .katex{font-size:1.04em;color:rgba(243,239,230,.92)}
.stagecap .live{flex:0 0 auto;width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 0 rgba(61,220,132,.6);animation:livePulse 2s infinite}
@keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(61,220,132,.55)}70%{box-shadow:0 0 0 8px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}

/* 3 つの要点（各章へのリンク） */
.ideas{list-style:none;margin:18px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.ideas a{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;row-gap:4px;align-items:center;
  padding:16px 18px;border-radius:var(--r);text-decoration:none;color:#f3efe6;background:rgba(255,255,255,.035);
  border:1px solid var(--night-rule);transition:background .2s,border-color .2s,transform .2s var(--ease)}
.ideas a:hover{background:rgba(255,255,255,.07);border-color:rgba(224,123,24,.45);transform:translateY(-2px)}
.ideas .in{grid-row:1/span 2;width:40px;height:40px;border-radius:50%;border:1.5px solid var(--brand);display:grid;place-items:center}
.ideas .in b{font-family:var(--f-serif);font-weight:400;font-size:1.3rem;color:var(--brand);line-height:1;transform:translateY(1px)}
.ideas a:hover .in{background:var(--brand)}
.ideas a:hover .in b{color:var(--night)}
.ideas .ie{font-size:1.02rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ideas .ie .katex{font-size:1.05em;color:#fff}
.ideas .ij{font-size:.78rem;color:rgba(243,239,230,.6);letter-spacing:.02em}

/* ---------- タブ（章のナビ）：画面の上に固定、すりガラス ---------- */
.tabs{position:sticky;top:0;z-index:40;margin:0;padding:0;display:block;
  background:rgba(245,243,238,.9);-webkit-backdrop-filter:saturate(1.3) blur(10px);backdrop-filter:saturate(1.3) blur(10px);
  border-bottom:1px solid var(--rule)}
.tabs-in{max-width:1240px;margin:0 auto;padding:0 16px;display:flex;gap:2px;align-items:stretch;min-height:var(--navh);
  overflow-x:auto;scrollbar-width:none}
.tabs-in::-webkit-scrollbar{display:none}
.tab{position:relative;flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;font:inherit;font-family:var(--f-jph);font-size:.88rem;font-weight:700;
  line-height:1.3;padding:0 13px;border:0;border-radius:0;background:none;color:var(--ink-3);cursor:pointer;white-space:nowrap;
  transition:color .18s}
.tab .tn{font-size:1.02rem;color:var(--ink-4);transition:color .18s}
.tab::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:var(--brand);
  transform:scaleX(0);transform-origin:center;transition:transform .28s var(--ease)}
.tab:hover{color:var(--ink);background:none;border:0}
.tab:hover .tn{color:var(--brand)}
.tab.on{color:var(--ink);background:none;border:0}
.tab.on .tn{color:var(--brand)}
.tab.on::after{transform:scaleX(1)}
.tab:focus-visible{outline-offset:-4px}
.tprog{position:absolute;left:0;bottom:-1px;height:2px;width:100%;transform-origin:0 50%;transform:scaleX(var(--prog,0));
  background:linear-gradient(90deg,rgba(224,123,24,.25),rgba(224,123,24,.9));pointer-events:none}
@media(max-width:700px){.tabs{position:sticky}.tab{font-size:.82rem;padding:0 11px}}

/* ---------- 本文 ---------- */
.wrap{max-width:1240px;padding:8px 16px 40px}
.mode.on{animation:modeIn .45s var(--ease) both}
@keyframes modeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.mode.on{animation:none}}

/* 章の扉 */
.modehead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:26px;align-items:start;margin:46px 0 22px;padding:0;background:none;border:0;border-radius:0}
.mh-num{width:84px;height:84px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;margin-top:4px;position:relative}
.mh-num::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px dashed var(--rule-2)}
.mh-num span{font-family:var(--f-serif);font-size:2.7rem;line-height:1;color:var(--ink);transform:translateY(1px)}
.mh-en{margin:0 0 6px;font-family:var(--f-serif);font-style:italic;font-size:1rem;color:var(--brand-600);letter-spacing:.01em}
.modehead h2{margin:0;font-size:clamp(1.6rem,3vw,2.35rem);font-weight:800;line-height:1.25;letter-spacing:-.02em;color:var(--ink)}
.modehead h2 .mh-c{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.modehead .mh-lead{margin:12px 0 0;font-size:1.02rem;line-height:1.95;color:var(--ink-2);max-width:52em}
.modehead .mh-lead .katex{font-size:1.06em}
.modehead .quizlink{margin:14px 0 0;font-size:.9rem;color:var(--ink-3)}
.quizlink a{display:inline-flex;align-items:center;gap:.35em;font-weight:700;color:#fff;background:var(--ink);border-radius:999px;padding:.15em .95em;text-decoration:none;margin:0 .2em;transition:background .18s}
.quizlink a::after{content:"→";font-family:var(--f-serif)}
.quizlink a:hover{background:var(--brand-700)}

/* 章の中のセクション一覧 */
.seclinks{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;padding:0 0 0 110px;font-size:.86rem}
.seclinks a{display:inline-flex;align-items:center;padding:.38em .95em;border:1px solid var(--rule-2);border-radius:999px;text-decoration:none;
  color:var(--ink-2);background:transparent;font-weight:600;transition:background .18s,border-color .18s,color .18s}
.seclinks a:hover{background:var(--surface);border-color:var(--ink);color:var(--ink)}

/* 章ごとの表示スイッチ（表示：…） */
.modebar{gap:8px 10px;margin:0 0 26px;padding:10px 14px;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);box-shadow:var(--sh-1)}
.modebar .lbl{font-size:.74rem;letter-spacing:.12em;color:var(--ink-4);font-weight:700;margin-right:2px}
.modebar label.chk{gap:.5em;font-size:.84rem;font-weight:600;color:var(--ink-2);background:var(--paper);border:1px solid transparent;border-radius:999px;padding:.32em .9em .32em .45em;transition:background .18s,border-color .18s}
.modebar label.chk:hover{background:var(--paper-2)}
.modebar label.chk input{width:28px;height:16px;border-radius:999px;border:0;background:var(--rule-2);position:relative;transition:background .2s;flex:0 0 auto}
.modebar label.chk input::before{content:"";position:absolute;left:2px;top:2px;width:12px;height:12px;border-radius:50%;background:#fff;clip-path:none;transform:none;
  box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .22s var(--ease)}
.modebar label.chk input:checked{background:var(--ink)}
.modebar label.chk input:checked::before{transform:translateX(12px)}
.modebar label.chk.glow{background:var(--brand-50);border-color:rgba(224,123,24,.5);color:var(--brand-700)}
.modebar .varbox{background:var(--paper);border:0;border-radius:var(--r-s)}
.modebar .presets button.tiny{border-radius:999px}

/* ---------- セクションのカード ---------- */
.sec{scroll-margin-top:calc(var(--navh) + 12px);background:var(--surface);border:1px solid rgba(20,23,28,.06);border-radius:var(--r-xl);margin:0 0 30px;box-shadow:var(--sh-2)}
.sec.high{border-color:rgba(122,90,168,.28);box-shadow:var(--sh-2),0 0 0 4px rgba(122,90,168,.06)}
.sL{padding:24px 26px 26px;border-right:1px solid var(--rule)}
.sR{padding:24px 22px 24px;background:var(--panel)}
@media(max-width:880px){.sL{border-right:0;border-bottom:1px solid var(--rule)}}
.sechead{gap:10px 12px;margin:0 0 10px;align-items:center}
.secnum{display:inline-flex;align-items:center;height:28px;padding:0 11px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:.84rem;letter-spacing:.04em}
.sechead h2{font-size:clamp(1.12rem,1.55vw,1.32rem);font-weight:800;line-height:1.45;letter-spacing:-.01em;color:var(--ink)}
.secdesc{margin:.2em 0 1em;font-size:.95rem;line-height:1.9;color:var(--ink-2)}
.assume{font-size:.76rem;color:var(--ink-4);line-height:1.7}
.deschint{color:var(--brand-700);background:var(--brand-50);border:0;border-radius:999px;padding:.3em 1em}

/* ---------- 操作 ---------- */
.ctrls{margin:0 0 14px}
.row1{gap:8px 8px}
.row1 .btns{gap:8px}
button.b{font:inherit;font-family:var(--f-jph);font-size:.86rem;font-weight:600;padding:.5em 1.05em;border:1px solid var(--rule-2);background:var(--surface);
  color:var(--ink);border-radius:999px;cursor:pointer;line-height:1.3;transition:background .16s,border-color .16s,transform .12s var(--ease),box-shadow .16s}
button.b:hover{background:var(--paper);border-color:var(--ink-4)}
button.b:active{transform:scale(.97)}
button.b.on{background:var(--ink);border-color:var(--ink);color:#fff}
button.b.play{min-width:8.2em;font-size:.98rem;font-weight:800;letter-spacing:.04em;padding:.6em 1.3em;background:var(--brand);border:0;color:#fff;
  box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 10px 24px -10px rgba(224,123,24,.85)}
button.b.play:hover{background:#ec8526;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 14px 30px -10px rgba(224,123,24,.95)}
button.b.play:active{transform:scale(.97)}
button.b.sm{font-size:.7rem;font-weight:700;line-height:1.2;border:1px solid rgba(224,123,24,.35);background:var(--brand-50);color:var(--brand-700);border-radius:12px;padding:.3em .8em}
button.b.sm:hover{background:var(--brand-100);border-color:var(--brand)}
button.b.sm.on{background:var(--brand-700);border:1px solid var(--brand-700);color:#fff}
button.tiny{font:inherit;font-family:var(--f-jph);font-size:.76rem;font-weight:600;padding:.28em .75em;border:1px solid var(--rule);background:var(--surface);color:var(--ink-3);border-radius:999px;transition:background .16s,border-color .16s,color .16s}
button.tiny:hover{border-color:var(--ink-4);color:var(--ink-2)}
button.tiny.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button.tiny.warm{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
button.tiny.warm:hover{background:#ec8526;color:#fff}
button.tiny.warm.on{background:var(--brand-700);border-color:var(--brand-700);color:#fff}
button.tiny.pt{background:var(--brand-50);border-color:rgba(224,123,24,.35);color:var(--brand-700);font-weight:700}
button.tiny.pt:hover{background:var(--brand-100);border-color:var(--brand)}
button.tiny.pt.on{background:var(--brand);border-color:var(--brand);color:#fff}
button.tiny.nudge{width:28px;height:28px;min-width:0;padding:0;display:inline-grid;place-items:center;border-radius:50%;font-family:var(--f-serif);font-size:1.05rem;font-weight:400;color:var(--ink-2);background:var(--surface);border:1px solid var(--rule-2)}
button.tiny.nudge:hover{background:var(--ink);border-color:var(--ink);color:#fff}
button[disabled]{cursor:not-allowed}

/* 操作のくぼみ（時間・スライドバー・ボタン群）：枠線なし、面の色だけ */
.tbox,.varbox,.adj.top,.simchecks,.vrow.choices,.presetbox{border:0 !important;border-radius:var(--r);background:var(--paper)}
.tbox{padding:.5em .85em;gap:.6em;background:linear-gradient(180deg,var(--brand-50),#fbeedd)}
.tbox .vl{color:var(--brand-700);font-weight:700;font-size:.82rem;letter-spacing:.04em}
.tbox .vv,.vrow .vv{font-family:var(--f-jph);font-weight:800;font-size:.95rem;color:var(--ink);letter-spacing:.01em;font-variant-numeric:tabular-nums}
.tbox .vv{color:var(--brand-700)}
.varbox{padding:.6em .9em;gap:.45em}
.vrow{gap:.6em}
.vrow .vl{color:var(--ink-2)}
.vrow.ticks{color:var(--ink-4)}
.presetbox{padding:.6em .7em;gap:.35em}
.presetbox .pl{color:var(--brand-700);letter-spacing:.06em}
.presetbox button.tiny.pt{border-radius:10px}
.simchecks{padding:.4em .7em}
.simchecks label.chk{color:var(--ink-2)}
.simchecks label.chk input{border-color:var(--ink-4);border-radius:4px}
.simchecks label.chk input:checked{background:var(--ink);border-color:var(--ink)}
.simchecks label.chk input::before{background:#fff}
.adj .al{color:var(--ink-3)}
.vrow.choices button.tiny.ch.on,.mrow button.tiny.on,.modebar button.tiny.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* スライドバー：細い溝＋塗り（--p）＋白縁のつまみ */
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;height:22px;cursor:pointer;--p:0%;--c:var(--brand)}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:999px;background:linear-gradient(90deg,var(--c) var(--p),var(--rule-2) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:999px;background:var(--rule-2)}
input[type=range]::-moz-range-progress{height:4px;border-radius:999px;background:var(--c)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;margin-top:-7px;border-radius:50%;background:var(--surface);
  border:5px solid var(--c);box-shadow:0 1px 4px rgba(20,23,28,.25);transition:transform .15s var(--ease)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--surface);border:5px solid var(--c);box-shadow:0 1px 4px rgba(20,23,28,.25)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.18)}
input[type=range]:focus-visible{outline:none}
input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(224,123,24,.3)}
.vrow input[type=range]{--c:var(--ink)}
.tbox input[type=range]{--c:var(--brand)}

/* ---------- 図・グラフ ---------- */
.cvwrap{border:1px solid var(--rule);border-radius:var(--r-l);background:#fff}
.cvwrap button.viewbtn,button.viewbtn.inbar{font-family:var(--f-jph);border-radius:999px;background:var(--brand-50);border:1px solid rgba(224,123,24,.45);color:var(--brand-700);font-weight:700}
.cvwrap button.viewbtn.on,button.viewbtn.inbar.on{background:var(--ink);border-color:var(--ink);color:#fff}
.cvwrap .viewbtns button.viewbtn.big{border-radius:999px}
.stagebox{border:1px solid var(--rule);border-radius:var(--r-l);background:#fff}
.stagetitle,.gtitle{font-family:var(--f-jph);color:var(--ink);letter-spacing:.01em}
.gtitle{font-size:.9rem}
.msgbox{border:0;border-radius:var(--r);background:var(--paper);color:var(--ink-2);padding:.6em .9em;line-height:1.75}
.msgbox.empty{background:transparent;border:1px dashed var(--rule-2);color:var(--ink-4)}
.readout{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-4)}
.fnote{color:var(--ink-4)}
.simhint{border:0;background:#effaf3;box-shadow:0 0 0 1.5px #1c8f4a inset,0 8px 20px -10px rgba(28,143,74,.5);border-radius:12px}
.finale{border-radius:16px;border-width:2px}

/* ---------- 右の列：式・考え方・覚えておくこと ---------- */
.eqzone{border:0;border-radius:var(--r);background:var(--surface);box-shadow:0 0 0 1px var(--rule) inset;padding:.8em 1em .9em}
.eqzone.wait{background:transparent;box-shadow:0 0 0 1px var(--rule-2) inset;border-radius:var(--r)}
.eqzone .eqt{color:var(--ink)}
.eqzone .eqt .bd{background:var(--ink);border-radius:999px;padding:0 .65em}
button.eqfold{border:0;border-radius:var(--r);background:var(--surface);box-shadow:0 0 0 1px var(--rule) inset;color:var(--ink);font-family:var(--f-jph);padding:.75em 1em;transition:background .16s}
button.eqfold:hover{background:var(--paper)}
button.eqfold.on{background:var(--paper-2)}
.note{border:0;border-radius:var(--r);background:#f2f6fb;box-shadow:inset 3px 0 0 #1663b5;padding:.8em 1.1em;line-height:1.85}
.note.wait{background:transparent;box-shadow:inset 0 0 0 1px var(--rule-2)}
.proof{border:0;border-radius:var(--r);background:#f1f7f2;box-shadow:inset 3px 0 0 #1c8f4a;padding:.85em 1.1em}
.memohead{border:0;border-radius:var(--r-l);background:var(--surface);box-shadow:0 0 0 1.5px var(--brand) inset,0 12px 30px -16px rgba(224,123,24,.55);padding:1em 1.2em;line-height:1.85}
.memohead .mt{font-size:.74rem;letter-spacing:.14em;color:var(--brand-700);margin-bottom:.45em}
.memohead b{color:var(--brand-700)}
.fill{border:0;border-radius:var(--r);background:#fffaf0;box-shadow:inset 0 0 0 1px #f0dfb4}
.gcell{border:1px solid var(--rule);border-radius:var(--r-l);padding:14px 14px 14px;background:#fff}
.cellhead{background:var(--paper);color:var(--ink);border-radius:999px;padding:.2em .9em;font-size:.92rem}
.cells{gap:16px}

/* ---------- ページの終わり ---------- */
.gnote{margin:44px 0 18px;padding:22px 26px;font-size:.84rem;line-height:1.85;color:var(--ink-3);background:transparent;border:0;border-top:1px solid var(--rule-2);border-radius:0}
.gnote .gh{font-size:.74rem;letter-spacing:.14em;color:var(--ink);margin:0 0 .3em}
.gnote b{color:var(--ink)}
.card.purpose{border:0;border-radius:var(--r-xl);background:var(--surface);box-shadow:var(--sh-2);padding:26px 30px;margin:0 0 18px}
.purpose .lead{font-size:.78rem;letter-spacing:.14em;color:var(--brand-700)}
.purpose ol{counter-reset:pp;list-style:none;padding:0;margin:.6em 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 28px}
.purpose li{counter-increment:pp;position:relative;padding-left:2.6em;line-height:1.85;color:var(--ink-2)}
.purpose li::before{content:counter(pp);position:absolute;left:0;top:.05em;width:1.8em;height:1.8em;border-radius:50%;border:1px solid var(--ink);display:grid;place-items:center;font-family:var(--f-serif);font-size:.95rem;color:var(--ink)}
@media(max-width:760px){.purpose ol{grid-template-columns:1fr}}
.pagenav{margin:28px 0 0;justify-content:center}
.navtop{font-family:var(--f-jph);font-weight:600;color:var(--ink-2);background:var(--surface);border:1px solid var(--rule-2);padding:.6em 1.4em}
.navtop:hover{background:var(--ink);border-color:var(--ink);color:#fff}
footer{margin:56px 0 0;padding:38px 16px 44px;background:var(--night);color:rgba(243,239,230,.55);font-size:.8rem;letter-spacing:.04em;text-align:center}

/* ---------- コンテンツ一覧のパネル ---------- */
.hero .tocpanel{top:96px;color:var(--ink)}
.tocpanel{border:0;border-radius:var(--r-l);box-shadow:var(--sh-3),0 0 0 1px rgba(20,23,28,.06);padding:18px 22px 22px;background:var(--surface)}
.tochead{border-bottom:1px solid var(--rule);padding-bottom:10px;margin-bottom:6px;font-size:1.05rem;font-family:var(--f-jph)}
.tocx{width:34px;height:34px;border-radius:50%;padding:0;display:grid;place-items:center;font-size:1.25rem;color:var(--ink-3);transition:background .16s}
.tocx:hover{background:var(--paper)}
.tocmode{font-family:var(--f-jph);font-size:.92rem;color:var(--ink);margin:16px 0 4px;padding-bottom:4px;border-bottom:1px dashed var(--rule)}
.tocpanel ul{list-style:none;padding:0}
.tocpanel li{margin:0;font-size:.88rem}
.tocpanel a{display:block;padding:.38em .6em;border-radius:10px;color:var(--ink-2);transition:background .14s,color .14s}
.tocpanel a:hover{background:var(--paper);color:var(--ink);text-decoration:none}

/* ---------- 開いた瞬間の案内 ---------- */
.notice{border:0;border-radius:var(--r-l);box-shadow:var(--sh-3);padding:1.4em 1.6em;font-size:.95rem;line-height:1.9}
.notice b{color:var(--brand-700)}
.notice .cls{border:0;background:var(--ink);color:#fff;border-radius:999px;padding:.55em 1.6em;font-family:var(--f-jph);font-weight:700}
.notice-bg{background:rgba(14,17,21,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}

/* ---------- 画面の幅ごとの調整 ---------- */
@media(max-width:980px){
  .ideas{grid-template-columns:1fr}
  .seclinks{padding-left:0}
}
@media(max-width:640px){
  :root{--navh:50px}
  .hero-in{padding:18px 16px 22px}
  .hero-top{align-items:flex-start}
  .kicker .en{display:none}
  .hero .introrow{flex-direction:column;gap:12px}
  .hero .tocbtn{min-height:0;padding:.75em 1.2em;align-self:flex-start}
  .hero .topbtns button{font-size:.72rem;padding:6px 11px 6px 6px}
  .stage{margin-top:22px;border-radius:var(--r)}
  .stage canvas{height:190px}
  .modehead{grid-template-columns:1fr;gap:12px;margin:30px 0 16px}
  .mh-num{width:58px;height:58px}
  .mh-num span{font-size:1.9rem}
  .sec{border-radius:var(--r-l)}
  .sL{padding:18px 16px 20px}
  .sR{padding:18px 14px 18px}
  .gnote{padding:18px 4px}
  .card.purpose{padding:20px 18px}
}

/* ---------- 第 2 弾の仕上げ ---------- */
.hero-title .nb{display:inline-block}
.gtitle button.tiny{white-space:nowrap}
.sq{display:inline-block;width:.5em;height:.5em;border-radius:2px;background:var(--brand);margin-right:.55em;vertical-align:.1em;flex:0 0 auto}
.proof .ttl .sq{background:#1c8f4a}
.memohead .mt .sq{width:.6em;height:.6em}

/* 読みこんだときの登場（下から静かに） */
@keyframes heroIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:no-preference){
  .hero-top{animation:heroIn .7s var(--ease) both}
  .hero-title .t1{animation:heroIn .8s .06s var(--ease) both}
  .hero-title .t2{animation:heroIn .8s .14s var(--ease) both}
  .hero .introrow{animation:heroIn .8s .2s var(--ease) both}
  .stage{animation:heroIn .9s .26s var(--ease) both}
  .ideas{animation:heroIn .9s .32s var(--ease) both}
}

/* タブ列：ヒーローを過ぎたら左はしに小さな題名（広い画面だけ） */
.navbrand{display:none;align-items:center;gap:8px;margin-right:14px;padding-right:16px;border-right:1px solid var(--rule-2);
  font-family:var(--f-jph);font-weight:800;font-size:.86rem;letter-spacing:-.01em;color:var(--ink);text-decoration:none;white-space:nowrap;
  opacity:0;transform:translateX(-6px);transition:opacity .3s var(--ease),transform .3s var(--ease)}
.navbrand i{width:9px;height:9px;border-radius:50%;background:var(--brand);box-shadow:0 0 0 3px rgba(224,123,24,.18)}
@media(min-width:1380px){
  .navbrand{display:inline-flex;align-self:center;max-width:0;overflow:hidden;margin-right:0;padding-right:0;border-right-color:transparent;
    transition:max-width .35s var(--ease),margin .35s var(--ease),padding .35s var(--ease),opacity .3s var(--ease),transform .3s var(--ease),border-color .3s}
  .tabs.stuck .navbrand{max-width:200px;margin-right:10px;padding-right:14px;border-right-color:var(--rule-2);opacity:1;transform:none}
  .tabs.stuck .tab{padding:0 10px}
  .tabs:not(.stuck) .navbrand{pointer-events:none}
}

/* フッター（章の目次つき） */
footer{text-align:left;padding:0;letter-spacing:0}
.ft-in{max-width:1240px;margin:0 auto;padding:46px 24px 40px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px 60px}
.ft-mark{margin:0;font-family:var(--f-serif);font-style:italic;font-size:clamp(1.6rem,3vw,2.3rem);color:#f3efe6;line-height:1.15}
.ft-mark span{display:block;font-family:var(--f-jph);font-style:normal;font-weight:700;font-size:.9rem;letter-spacing:.06em;color:rgba(243,239,230,.55);margin-top:10px}
.ft-nav{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 24px}
.ft-nav a{display:flex;gap:10px;align-items:baseline;padding:6px 0;color:rgba(243,239,230,.75);text-decoration:none;font-size:.86rem;border-bottom:1px solid rgba(255,255,255,.07);transition:color .16s}
.ft-nav a:hover{color:#fff}
.ft-nav a b{font-family:var(--f-serif);font-weight:400;color:var(--brand);min-width:1.4em}
.ft-base{grid-column:1/-1;display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08);font-size:.76rem;color:rgba(243,239,230,.4)}
.ft-base a{color:rgba(243,239,230,.7)}
@media(max-width:760px){.ft-in{grid-template-columns:1fr}.ft-nav{grid-template-columns:1fr}}

@media(max-width:640px){
  .stage canvas{height:220px}
}
@media(max-width:560px){
  .vrow{gap:.35em}
  .vrow input[type=range]{min-width:48px}
  .vrow .vl{min-width:3.6em}

.crumbs{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px;margin:0;font-size:.8rem;font-weight:600;letter-spacing:.06em;color:rgba(243,239,230,.6)}

/* =========================================================================
   光らせる演出を軽くする（第 29 回）
   box-shadow や背景色を毎フレーム描きかえる無限アニメは、何もしていなくても CPU を 20〜50% 使っていた
   （⑤のように光るボタンが多い章ほど重い）。光の輪は「重ねた輪の不透明度と大きさ」だけを動かす
   → ブラウザの合成（GPU）だけで済み、ページの描き直しが起きない。見た目の強さは前と同じくらい。
   ========================================================================= */
button.glow, .cvwrap .viewbtns button.viewbtn.big, .modebar label.chk.glow, .finale, button.b.play.sg-glow, .stagecap .live{animation:none !important}
.inbar.glow, .viewbtns button.glow, button.b.play.sg-glow, .modebar label.chk.glow{position:relative}
button.glow::after, .modebar label.chk.glow::after, button.b.play.sg-glow::after, .finale::after, .stagecap .live::after{
  content:""; position:absolute; inset:-3px; border-radius:inherit; pointer-events:none;
  box-shadow:0 0 0 3px rgba(224,123,24,.6), 0 0 18px 3px rgba(224,123,24,.55);
  opacity:0; animation:ringPulse 1.4s ease-in-out infinite; will-change:opacity,transform}
@keyframes ringPulse{0%,100%{opacity:.12;transform:scale(1)}50%{opacity:1;transform:scale(1.045)}}
button.b.play.sg-glow{background:var(--brand) !important;border-color:var(--brand) !important}
button.b.play.sg-glow::after{inset:-4px;box-shadow:0 0 0 4px rgba(224,123,24,.55),0 0 24px 6px rgba(224,123,24,.6)}
.modebar label.chk.glow::after{inset:-2px;box-shadow:0 0 0 3px rgba(224,123,24,.38)}
.finale::after{border-radius:16px;box-shadow:0 0 0 4px rgba(214,39,27,.35),0 0 24px 4px rgba(214,39,27,.55)}
.stagecap .live{position:relative;box-shadow:none}
.stagecap .live::after{inset:-1px;border-radius:50%;box-shadow:0 0 0 5px rgba(61,220,132,.45);animation-duration:2s}
/* 「真上から見る」はとくに目立たせたいので、ボタン自体も少し大きくなったり戻ったり（transform は合成だけで済む） */
.cvwrap .viewbtns button.viewbtn.big{animation:viewPop 1.05s ease-in-out infinite !important;will-change:transform}
@keyframes viewPop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.cvwrap .viewbtns button.viewbtn.big::after{box-shadow:0 0 0 6px rgba(224,123,24,.32),0 0 26px 6px rgba(224,123,24,.85)}
@media(prefers-reduced-motion:reduce){
  button.glow::after, .modebar label.chk.glow::after, button.b.play.sg-glow::after, .finale::after, .stagecap .live::after{animation:none;opacity:.8}
  .cvwrap .viewbtns button.viewbtn.big{animation:none !important}
}

/* スライドバーの目盛りの文字：つまみの位置に合わせて置く（位置は JS が計算：第 29 回） */
.vrow.ticks.tk-on{position:relative;display:block;height:1.35em;padding:0 !important;margin-top:-.3em}

/* 光の輪は、ボタンの外に広がらないようにボタン自身を基準にする（基準がないとページ全体に輪が広がり、横スクロールまで出た：第 29 回） */
button.glow{position:relative}
button.viewbtn.inbar.glow, .cvwrap .viewbtns button.viewbtn.glow{position:relative}

.vrow.cell{display:block;padding:.15em 0}
.vrow.cell .vhead{display:flex;align-items:center;gap:.35em;min-width:0}
.vrow.cell .vhead .vl{min-width:0;white-space:nowrap}
.vrow.cell .vhead .vsp{flex:1 1 auto}
.vrow.cell .vhead .vv{min-width:0;text-align:right;white-space:nowrap}
.vrow.cell.wide .vhead .vv{white-space:normal}
.vrow.cell .vbar{display:flex;align-items:center;gap:.4em;min-width:0}
.vrow.cell .vbar input[type=range]{flex:1 1 auto;min-width:0;width:auto}
.vrow .wtex{font-weight:400;color:var(--ink-3)}
.vrow .wtex .katex{font-size:1em}
.stoptk{display:flex;justify-content:space-between;font-size:.7rem;color:var(--ink-4);padding:0 2.6em;margin-top:-.15em;font-variant-numeric:tabular-nums}
/* 鍵 */
button.lockbtn{display:inline-grid;place-items:center;width:24px;height:24px;padding:0;border-radius:7px;border:1px solid var(--rule-2);background:var(--surface);color:var(--ink-4);cursor:pointer;flex:0 0 auto;transition:background .15s,color .15s,border-color .15s}
button.lockbtn svg{width:14px;height:14px}
button.lockbtn:hover{border-color:var(--ink-3);color:var(--ink-2)}
button.lockbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.vrow.locked .vbar,.vrow.locked .stoptk{opacity:.42}
.vrow.locked .vv{color:var(--ink-2)}
.vrow input[type=range]:disabled{cursor:not-allowed}
button.tiny.nudge:disabled{opacity:.5;cursor:not-allowed}
.lockmsg{font-size:.8rem;line-height:1.6;color:var(--brand-700)}
.lockmsg:not(:empty){background:var(--brand-50);border-radius:10px;padding:.45em .7em;margin-top:.35em}

/* ---------- 2026-10-04：スライダーを低く（縦幅を狭く）・ボタンはスライダーの下・時間バーの右に回転数 ---------- */
.ctrls{display:flex;flex-direction:column;gap:.45em}
.ctrls .row1{margin:0}
.varbox.cols2{padding:.4em .7em .45em;row-gap:0;column-gap:1.1em}
.varbox.cols2 .vcol{gap:0}
.vrow.cell{padding:.05em 0 .1em;line-height:1.35}
.vrow.cell .vhead{font-size:.8rem;gap:.3em;min-height:22px}
.vrow.cell .vhead .vl{font-size:.8rem}
.vrow.cell .vhead .vv{font-size:.84rem}
.vrow.cell .vbar{gap:.3em;min-height:22px}
.vrow.cell .vbar input[type=range]{height:18px}
.vrow.cell button.tiny.nudge{width:22px;height:22px;font-size:.9rem}
.vrow.cell + .vrow.cell{border-top:1px solid rgba(20,23,28,.05)}
.stoptk{font-size:.62rem;line-height:1.1;margin:-.15em 0 .1em;padding:0 30px}
button.lockbtn{width:21px;height:21px;border-radius:6px}
button.lockbtn svg{width:12px;height:12px}
.trow{display:flex;align-items:center;gap:.6em;flex-wrap:wrap}
.trow .tbox{flex:1 1 300px;max-width:74%;min-width:0}
.trow .tbox input[type=range]{min-width:0;width:auto;flex:1 1 60px}
.trow .tinfo{flex:0 0 auto;font-size:.84rem;color:var(--ink-2);background:var(--paper);border-radius:999px;padding:.3em .9em;font-variant-numeric:tabular-nums;white-space:nowrap}
.trow .tinfo b{font-size:1rem;color:var(--ink)}
@media(max-width:520px){.trow .tbox{max-width:100%}}
.trow{flex-wrap:nowrap}
.trow .tbox{flex:1 1 auto;max-width:none}
@media(max-width:520px){.trow .tinfo{font-size:.76rem;padding:.25em .6em}.trow .tinfo b{font-size:.9rem}.trow .tbox .vl{font-size:.76rem}}
/* 回転数のローリング表示 */
.tinfo .tpre{margin-right:.3em}
.tinfo .tunit{margin-left:.25em}
.tinfo .roll{display:inline-block;font-size:1.05rem;height:1.3em;overflow:hidden;vertical-align:-.32em;line-height:1.3em;min-width:1.2em;text-align:center}
.tinfo .rin{display:flex;flex-direction:column;transform:translateY(0)}
.tinfo .rin b{display:block;height:1.3em;line-height:1.3em;font-size:1em;color:var(--ink)}
.tinfo .rin.go{animation:rollUp .42s cubic-bezier(.2,.75,.2,1) forwards}
@keyframes rollUp{from{transform:translateY(0)}to{transform:translateY(-1.3em)}}
.tinfo .rin:not(.go) .r1{display:none}
.tinfo .rin.go .r1{display:block}
@media(prefers-reduced-motion:reduce){.tinfo .rin.go{animation:none;transform:translateY(-1.3em)}}

/* ---------- モード2：観測者の切りかえ・式の箱 ---------- */
button.b.obs{font-size:.8rem;padding:.42em .9em;background:var(--surface);color:var(--ink-2)}
button.b.obs.on{background:var(--ink);border-color:var(--ink);color:#fff}
button.b.obs[data-k]{}
button.b.chkb.on{background:var(--brand-50);border-color:var(--brand);color:var(--brand-700);font-weight:700}
button.b.chkb::before{content:"";display:inline-block;width:.8em;height:.8em;margin-right:.4em;border:1.5px solid currentColor;border-radius:3px;vertical-align:-.05em}
button.b.chkb.on::before{background:currentColor;box-shadow:inset 0 0 0 2px #fff}
.belowcv{margin-top:.6em}
.eqpair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:.6em}
@media(max-width:620px){.eqpair{grid-template-columns:minmax(0,1fr)}}
.eqcard{border-radius:var(--r);padding:.55em .8em .6em;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);font-size:.86rem;line-height:1.6;opacity:.72;transition:opacity .2s,box-shadow .2s}
.eqcard.on{opacity:1;background:var(--surface)}
.eqcard.in.on{box-shadow:inset 0 0 0 2px #1663b5}
.eqcard.rot.on{box-shadow:inset 0 0 0 2px #3f4a54}
.eqcard .eqh{margin:0 0 .25em;font-weight:800;font-size:.84rem;color:var(--ink)}
.eqcard.in .eqh{color:#1663b5}
.eqcard.rot .eqh{color:#3f4a54}
.eqcard .eqh .now{display:inline-block;margin-left:.5em;font-size:.68rem;font-weight:700;color:#fff;background:var(--ink);border-radius:999px;padding:0 .6em;vertical-align:.1em}
.eqcard .eql2{overflow-x:auto;overflow-y:hidden;padding:.1em 0}
.eqcard .eqk{font-size:.76rem;color:var(--ink-3);margin-right:.3em}
.eqcard .eqnum{margin:.25em 0 0;font-size:.8rem;color:var(--ink-2);font-variant-numeric:tabular-nums}
.eqcard .eqnote{margin:.15em 0 0;font-size:.74rem;color:var(--ink-3)}
.qcard.part{transition:box-shadow .25s,background .25s}
.qcard.part.hl{background:var(--brand-50);box-shadow:inset 0 0 0 2px var(--brand),0 8px 22px -12px rgba(224,123,24,.7)}
.qcard.derive{box-shadow:inset 0 0 0 2px #1c8f4a;background:#f1f7f2}
.qlead{font-size:.9rem;color:var(--ink-2);margin:0 0 .8em;line-height:1.8}
a.golink{display:inline-block;font-weight:700;color:#fff;background:var(--ink);border-radius:999px;padding:.3em 1em;text-decoration:none}
a.golink:hover{background:var(--brand-700)}
.modebar label.chk.rotsw{font-weight:700}

/* ---------- 2026-10-04 その2：ボタン列を 1 行に・対のボタン・視点 3 つ ---------- */
.ctrls .row1 .btns{flex-wrap:nowrap;gap:.35em;align-items:stretch;flex:1 1 auto}
.ctrls .row1 .btns button{flex:0 0 auto}
button.b.two{font-size:.7rem;line-height:1.2;padding:.25em .75em;white-space:nowrap;font-weight:700}
.ctrls .row1 .btns button.gapL{margin-left:.9em}
@media(max-width:560px){
  .ctrls .row1 .btns{flex-wrap:wrap}
  .ctrls .row1 .btns button.b{font-size:.78rem;padding:.4em .7em}
  .ctrls .row1 .btns button.b.play{font-size:.88rem;min-width:6.4em}
  .ctrls .row1 .btns button.b.two{font-size:.66rem;padding:.2em .55em}
}
.row1b{display:flex;flex-wrap:wrap;gap:.4em;align-items:center}
.seg{display:inline-flex;border-radius:999px;background:var(--paper-2);padding:3px;gap:0;max-width:100%}
.seg button.b{border:0;border-radius:999px;background:transparent;color:var(--ink-3);font-size:.8rem;padding:.42em 1em;white-space:normal;line-height:1.3;text-align:center}
.seg button.b:hover{background:rgba(255,255,255,.6);color:var(--ink)}
.seg button.b.on{background:var(--ink);color:#fff;box-shadow:0 2px 6px -2px rgba(20,23,28,.45)}
.seg button.b.on.rotb{background:var(--cent,#3f4a54)}
.cvwrap .viewbtns{gap:5px}
/* ---- 1-1：連動する組の色（ω・T・n は青系、r は緑系）。右の表の行も同じ色 ---- */
.vrow.cell.grpW,.vrow.cell.grpR{padding-left:.5em;padding-right:.5em}
.vrow.cell.grpW{background:#e9f0fa}
.vrow.cell.grpR{background:#ecf5e5;border-radius:9px;margin-bottom:.3em}
.vrow.cell.grpW:not(.grpW + .grpW){border-radius:9px 9px 0 0}
.vrow.cell.grpW:last-child{border-radius:0 0 9px 9px}
.reltab tr.grpW th,.reltab tr.grpW td{background:#e9f0fa}
.reltab tr.grpR th,.reltab tr.grpR td{background:#ecf5e5}
.reltab tr.on th,.reltab tr.on td{box-shadow:inset 0 2px 0 var(--brand),inset 0 -2px 0 var(--brand)}
/* 質量 m：ほかの量とちがう（鍵がない・小球そのものの性質）ので、破線のわく＋明朝体の名前 */
.vrow.cell.mrow{margin-top:.45em;padding:.25em .5em .3em;border:1.5px dashed #b9ab92;border-radius:9px;background:#fffdf7}
.vrow.cell.mrow .vhead .vl{font-family:var(--f-serif,serif);font-weight:700;color:#6b5a3a}
/* 選んでいる量（右の列の「選択」・図の文字のクリック）はスライダーもオレンジのわくで強調 */
.vrow.cell.sel{box-shadow:0 0 0 2px var(--brand);border-radius:9px;background:var(--brand-50)}
/* 図（方眼紙）の左上に置くボタン（1-1「✂ 糸を切る！」） */
.cvwrap .cvbtns{position:absolute;left:10px;top:10px;display:flex;gap:6px;z-index:2}
.cvwrap .cvbtns button.b{font-size:.84rem;padding:.38em .95em}
/* スライダーの中の目印（2-1 の ω₀、2-3 の ω₀） */
.sliders .rw{position:relative;display:flex;align-items:center;flex:1 1 40px;min-width:0}
.sliders .rw input[type=range]{flex:1 1 auto;min-width:0;width:auto}
.sliders .vmark{position:absolute;top:-2px;bottom:-2px;left:calc(9px + (100% - 18px) * var(--m,0));width:0;border-left:2px solid #0f8a8a;pointer-events:none}
.sliders .vmark .katex{position:absolute;left:3px;top:-.95em;font-size:.72rem;color:#0a5c5c;white-space:nowrap;background:rgba(255,255,255,.85);border-radius:3px;padding:0 2px;line-height:1.1}
/* ---- 「運動方程式」「力のつり合いの式」の札（ページ全体で同じ色） ---- */
.t-eom{color:#c62828;font-weight:800}
.t-bal{color:#2e7d32;font-weight:800}
.eqtag{display:inline-block;font-size:.68rem;font-weight:800;line-height:1.5;border-radius:6px;padding:0 .45em;margin-right:.45em;vertical-align:.12em;white-space:nowrap}
.eqtag.eom{color:#c62828;background:#fdecea;box-shadow:inset 0 0 0 1px rgba(198,40,40,.45)}
.eqtag.bal{color:#2e7d32;background:#e8f5e9;box-shadow:inset 0 0 0 1px rgba(46,125,50,.45)}
.qeqrow{display:flex;align-items:center;gap:.4em;flex-wrap:wrap;justify-content:center}
.qeqrow .qeqm{min-width:0;overflow-x:auto}
.qeqrow .qeqm .katex-display{margin:.25em 0}
button.b.ramp{background:#0f8a8a;border-color:#0f8a8a;color:#fff;font-weight:800}
button.b.ramp:hover{background:#0a6f6f;border-color:#0a6f6f}
/* ---- モード3 のグラフ ---- */
.gwrap{margin-top:.9em}
.gbar{display:flex;align-items:center;justify-content:space-between;gap:.5em;flex-wrap:wrap;margin:0 0 .4em}
.gbar .gtip{font-size:.72rem;color:var(--ink-3)}
.gbox{background:var(--surface);border-radius:10px;box-shadow:inset 0 0 0 1px var(--rule);padding:.45em .5em .4em;margin-bottom:.6em;min-width:0}
.gbox .ghead{display:flex;align-items:center;gap:.4em;font-size:.8rem;font-weight:700;min-height:26px}
.gbox .ghead .gt{white-space:nowrap}
.gbox .ghead .gsel{flex:1 1 auto;font-weight:600;color:#3d4c5a;font-size:.74rem;font-variant-numeric:tabular-nums;min-width:0}
.gbox .gmax{flex:0 0 auto;width:26px;height:26px;border:1px solid var(--rule-2);border-radius:7px;background:#fff;color:var(--ink-2);display:grid;place-items:center;padding:0;cursor:pointer}
.gbox .gmax svg{width:15px;height:15px}
.gbox canvas.gcv{display:block;width:100%;height:170px;touch-action:none;cursor:grab}
.gbox .gleg{display:flex;flex-wrap:wrap;gap:.2em .9em;font-size:.72rem;color:var(--ink-2);margin-top:.2em}
.gbox .gleg i{display:inline-block;width:22px;vertical-align:middle;margin-right:.3em}
.gbox.gmaxed{position:fixed;inset:12px;z-index:80;box-shadow:0 10px 40px rgba(0,0,0,.3),inset 0 0 0 1px var(--rule);overflow:auto}
.gbox.gmaxed canvas.gcv{height:70vh}
/* せまい画面：観測者の対のボタンは 2 行までにおさめる（高さ 46px 以下） */
@media(max-width:380px){ .seg button.b.obs{font-size:.66rem;padding:.3em .5em;line-height:1.25} }
.sliders .vmark:nth-of-type(2) .katex{top:auto;bottom:-1.1em}
/* モードの見出しの下：全セクションの観測者の切りかえ（対のボタン） */
.modebar .rotsw{display:inline-flex;align-items:center;gap:.4em;flex-wrap:wrap;margin-left:auto}
.modebar .rotsw .lbl{font-size:.78rem;font-weight:700;color:var(--ink-2)}
.modebar .rotsw .seg button.b{font-size:.76rem;padding:.35em .8em}
@media(max-width:560px){ .modebar .rotsw{margin-left:0} .modebar .rotsw .seg button.b{font-size:.66rem;padding:.3em .5em} }
/* ---- 右の列の「立式」カード（モード2・3 共通）：方向の名前・札・式。いまの観測者の色で光る ---- */
.qcard.setup.in{box-shadow:inset 0 0 0 2px #1663b5,0 0 0 4px rgba(22,99,181,.10)}
.qcard.setup.rot{box-shadow:inset 0 0 0 2px #3f4a54,0 0 0 4px rgba(63,74,84,.12)}
.qcard.setup.in .qt{color:#1663b5}
.qcard.setup.rot .qt{color:#3f4a54}
.qcard.setup .qt .now{display:inline-block;margin-left:.5em;font-size:.68rem;font-weight:700;color:#fff;background:var(--ink);border-radius:999px;padding:0 .6em;vertical-align:.15em}
.qcard.setup .dirs{display:flex;flex-direction:column;gap:.35em;margin:.5em 0}
.qcard.setup .dirrow{display:grid;grid-template-columns:9.6em minmax(0,1fr);align-items:center;gap:.4em;background:var(--paper);border-radius:9px;padding:.2em .6em;transition:background .2s,box-shadow .2s}
.qcard.setup .dirrow .dirlab{font-size:.76rem;font-weight:800;color:var(--ink-2);line-height:1.35}
.qcard.setup .dirrow .qeqrow{justify-content:flex-start}
.qcard.setup .dirrow.hl{background:var(--brand-50);box-shadow:inset 0 0 0 2px var(--brand)}
@media(max-width:520px){ .qcard.setup .dirrow{grid-template-columns:minmax(0,1fr)} }

</style>

/* ===== 30_physics.js ===== */
/* =========================================================================
   30_physics.js … 物理の計算だけ（純粋な関数。描画を混ぜない）
   記号は教科書にそろえる：半径 r・速さ v・角速度 ω・周期 T・回転数 n・加速度 a・向心力 F・
   張力 S（周期 T と区別するため）・摩擦係数 μ・角 θ。

'use strict';

/* ---------- モード1：水平なめらかな台の上の等速円運動（中心の穴 O に糸を通し、台の下で手が引く） ---------- */
var M1 = {
  m: 0.10,            /* 小球の質量 [kg]（1-1 の質量スライダーで 0.05〜0.20 kg。M1.mRef は F の矢印の縮尺の基準） */
  mRef: 0.20,
  Lx: 1.40, Ly: 1.40, /* 台の半分の幅（横・奥行き）[m]。小球が台のはしに来たら止める。

  W: [Math.PI / 4, Math.PI / 2, 3 * Math.PI / 4, Math.PI],   /* 角速度は 4 択（π/4・π/2・3π/4・π rad/s）＝ 2026-10 千葉さんの指定 */
  zHand: 1.0,         /* 台の下で糸を持つ手の高さ（既定 r = 0.40 m のとき）[m] */
  Lstr: 1.40,         /* 糸の全長 [m]：r ＋（台の下の長さ）。r を変えると手が上下する */
  handDepth: function (r) { return M1.Lstr - r; },
  rb: 0.045,          /* 小球の半径 [m]（絵の大きさ） */
  tMax: 30,           /* 糸を切らないときの時間バーの長さ [s] */
  R: {                /* スライダーの範囲（約束 A：r を動かすと ω 固定、ほかは r・m 固定で ω を変える） */
    r: [0.20, 0.80], w: [Math.PI / 4, Math.PI]

/* 鍵（固定）つきの連動。key を x にしたいとき、鍵のかかった量を変えずにできる (r, ω) をさがす。

  if (ws.length === 1 && L.r && key !== 'w' && key !== 'T' && key !== 'n') {   /* r も ω も固定：動かせる量がない */
    var why2 = [];
    if (L.r) why2.push('r'); wFix.forEach(function (k) { why2.push(k); });
    if (L.v && key !== 'v') why2.push('v'); if ((L.a) && key !== 'a') why2.push('a'); if (L.F && key !== 'F') why2.push('F');
    return { ok: false, why: why2 };

/* ---------- モード2：等速円運動と力 ---------- */
var M2 = {
  /* セクション1：ターンテーブルと箱（質量 m）。静止摩擦係数 μ（すべり出したあとの動摩擦係数も μ とする） */
  s1: { m: 0.20, R: 0.60, half: 0.045,

   「✂ 糸を切る！」：上から見下ろす視点に変わり、はさみが出てきて台の上の糸を切る。
                     切った瞬間から、小球はその瞬間の速度 v⃗ のまま等速直線運動をする。

   ========================================================================= */

/* 動かせなかったときのひとこと */
function m1LockMsg(k, why) {

  if (why.length === 1 && why[0] === k) return '🔒 ' + nm(k) + ' は固定されています。動かすには、' + nm(k) + ' の右の鍵を外そう。';
  var ws = why.filter(function (q) { return q !== k; });
  var t = '🔒 ' + ws.map(nm).join('・') + ' が固定されているので、' + nm(k) + ' は変えられません。';
  if (['w', 'T', 'n'].indexOf(k) >= 0) t += '（角速度 $\\omega$・周期 $T$・回転数 $n$ は連動するので、3 つとも鍵を外す必要がある）';

/* ---------- 糸を切る：①上から見下ろす視点へ ②はさみが出てきて糸を切る ③そこから等速直線運動 ----------
   切っているあいだ（①②）は時刻を止める。切った瞬間 tCut から運動を再開する */
var M1CUT = { cam: 0.7, inT: 0.45, close: 0.45, fade: 0.7 };
function m1StartCut(s) {
  if (s.tCut !== null || s.cutAnim) return;
  if (s.strobe) s.t = m1TDisp(s);                    /* ストロボ中は、見えている位置で切る */
  var wasPlay = s.playing;
  s.playing = false; s.syncPlayLabel();
  s.cutAnim = { t0: performance.now(), cam0: { az: s.cam.az, el: s.cam.el }, snipped: false, wasPlay: wasPlay, k: 0 };
  s.topPressed = true; syncTopGlow(s);
  if (s.extra && s.extra.cut) { s.extra.cut.disabled = true; }
  var step = function (now) {
    var A = s.cutAnim; if (!A) return;
    var e = (now - A.t0) / 1000;
    A.e = e;
    var u = clamp(e / M1CUT.cam, 0, 1), ee = u * u * (3 - 2 * u);
    var daz = ((0 - A.cam0.az + 540) % 360) - 180;          /* 近いほうへ回す */
    s.cam.az = A.cam0.az + daz * ee; s.cam.el = A.cam0.el + (90 - A.cam0.el) * ee;
    m1SyncViewBtns(s);
    var tSnip = M1CUT.cam + M1CUT.inT + M1CUT.close;
    if (!A.snipped && e >= tSnip) {
      A.snipped = true; s.tCut = s.t; s.syncCut();
      SIMS.forEach(function (o) { if (o !== s && o.playing) { o.playing = false; o.syncPlayLabel(); } });
      s.playing = true; s.syncPlayLabel(); startLoop();     /* 切った瞬間から動きはじめる */
    }
    if (e >= tSnip + M1CUT.fade) { s.cutAnim = null; s.draw(); return; }

/* ストロボ中は 1 秒ごとにしか位置を見せない（パッパッパッ）。円運動のあいだは t = 0,1,2…、糸を切ったあとは切った瞬間から 1 秒ごと */
function m1TDisp(s) {
  if (!s.strobe) return s.t;
  if (s.tCut !== null && s.t > s.tCut) return s.tCut + Math.floor(s.t - s.tCut + 1e-9) + 1e-9;
  return Math.floor(s.t + 1e-9);

/* はさみ（添付の絵：黒い持ち手＋銀の刃）。(px,py)＝支点、(ax,ay)＝刃の向き（単位ベクトル）、open＝開き角［rad］ */
function scissors(ctx, px, py, ax, ay, open, k, alpha) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(px, py); ctx.rotate(Math.atan2(ay, ax)); ctx.scale(k, k);
  [-1, 1].forEach(function (sg) {
    ctx.save(); ctx.rotate(sg * open / 2);
    /* 刃（支点から先へ細くなる） */
    ctx.beginPath(); ctx.moveTo(-6, -4 * sg); ctx.quadraticCurveTo(30, -7 * sg, 66, -1 * sg); ctx.lineTo(66, 0.5 * sg); ctx.quadraticCurveTo(30, 4 * sg, -6, 3 * sg); ctx.closePath();
    var g = ctx.createLinearGradient(0, -6, 0, 6); g.addColorStop(0, '#e9ecef'); g.addColorStop(1, '#a7adb5');
    ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = '#2b2f35'; ctx.lineWidth = 1.4; ctx.stroke();
    /* 持ち手（黒い輪） */
    ctx.save(); ctx.rotate(-sg * 0.32);
    ctx.beginPath(); ctx.moveTo(-4, -3 * sg); ctx.lineTo(-22, -6 * sg); ctx.lineTo(-22, 2 * sg); ctx.lineTo(-4, 4 * sg); ctx.closePath();
    ctx.fillStyle = '#1d2024'; ctx.fill();

    ctx.beginPath(); ctx.ellipse(-36, 0, 9, 6, 0, 0, TAU); ctx.fillStyle = '#ffffff'; ctx.fill();

    ctx.restore();

/* 台の下で糸を持つ手（図 1 のように、こぶしで糸をにぎって下へ引く）。(x,y)＝こぶしの上（糸が入るところ）、s＝大きさ */
function handBelow(ctx, x, y, s) {
  ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.fillStyle = '#f6e4d2'; ctx.strokeStyle = '#6d5a49'; ctx.lineWidth = 1.3;
  /* うで（下へ） */
  ctx.beginPath(); ctx.moveTo(x - s * 0.34, y + s * 0.9); ctx.lineTo(x - s * 0.30, y + s * 2.0); ctx.lineTo(x + s * 0.34, y + s * 2.0); ctx.lineTo(x + s * 0.36, y + s * 0.9); ctx.closePath(); ctx.fill(); ctx.stroke();
  /* こぶし */
  rrect(ctx, x - s * 0.48, y + s * 0.02, s * 0.92, s * 0.98, s * 0.28); ctx.fill(); ctx.stroke();

function drawM1(s, ctx, W, H) {

  var showF = s.ms.showF, cam = s.cam, top = cam.el > 75;

  var take = function (q3) { var q = pj0.p(q3); bx0 = Math.min(bx0, q.x); bx1 = Math.max(bx1, q.x); by0 = Math.min(by0, q.y); by1 = Math.max(by1, q.y); };
  [-1, 1].forEach(function (sx) { [-1, 1].forEach(function (sy) { [-0.06, 0.40].forEach(function (z) { take([sx * M1.Lx, sy * M1.Ly, z]); }); }); });
  take([0, 0, -M1.handDepth(M1.R.r[0]) - 0.32]);            /* 台の下の手（うで）まで入れる（いちばん下がったとき） */
  var mgT = 48, mgB = 36, mgX = 10;

  var dOf = function (n) { var a = pj0.p(n), o = pj0.p([0, 0, 0]); return a.d - o.d; };
  s._pj = pj;

  /* 台の下：穴 O から下へのびる糸と、それを引く手（台より先に描く → 台にかくれる部分は自然にかくれる）。

  var hb = P([0, 0, -th]), hh = P([0, 0, -M1.handDepth(p.r)]);   /* 糸の長さは一定：r を大きくすると手が上がる */

    { n: [1, 0, 0], q: [[Lx, Ly], [Lx, -Ly]] }, { n: [-1, 0, 0], q: [[-Lx, -Ly], [-Lx, Ly]] }];

/* ---------- 「ω を大きくしていく」：ω を少しずつ大きくし、限界の ω₀ に達したら一瞬止めてから、すべり出す／糸が切れる ----------
   d.ramp = { crit(s) → ω₀, fire(s, ω₀)（限界をこえさせる）, sync(s)（ω に連動する量をそろえる）, prep(s)（すべり・切れをもとにもどす）,
              noReach(s) → 届かないときのひとこと }。表示中は操作を受け付けない */

function m2StartRamp(s) {
  var d = s.def, R = d.ramp; if (s.ramp) return;

  var ctr = s.L.querySelector('.ctrls'); s.L.classList.add('m1busy');
  if (ctr) ctr.inert = true; s.cw.inert = true;
  SIMS.forEach(function (o) { if (o !== s && o.playing) { o.playing = false; o.syncPlayLabel(); } });
  s.playing = false; s.syncPlayLabel();
  s.ramp = { ph: 'up', last: 0, p: 0, wc: wc, rr: 0 };
  s.extra.ramp.textContent = '実行中…';
  var tick = function (ts) {
    var A = s.ramp; if (!A) return;
    var dt = A.last ? Math.min(0.05, (ts - A.last) / 1000) : 0; A.last = ts;
    if (A.ph === 'up') {
      var wO = s.v.w;
      s.v.w = Math.min(wc, s.v.w + rate * dt); if (R.sync) R.sync(s);
      s.ph += (wO - s.v.w) * s.t;

    } else {
      A.p += dt;                                              /* 一瞬止めてから */
      if (A.p >= M2RAMP.pause) {

        R.fire(s, wc);

/* =========================================================================

/* トップページの文字列から SITE・EXPSITE の中身を取り出す（失敗したら null） */
function parseSiteIndex(txt){
  try{
    const grab = (name)=>{ const i = txt.indexOf("const "+name+" = ["); if(i<0) return "";
      const j = txt.indexOf("\nconst ", i+10); return txt.slice(i, j<0? undefined : j); };
    const out = [];
    [["SITE","シミュレーション"],["EXPSITE","実験"]].forEach(([nm, g])=>{
      const src = grab(nm); if(!src) return;
      src.split(/\{\s*\n\s*id:"/).slice(1).forEach(chunk=>{
        const id = (chunk.match(/^([\w-]+)"/)||[])[1], name = (chunk.match(/name:"([^"]+)"/)||[])[1], color = (chunk.match(/color:"(#[0-9a-fA-F]{3,8})"/)||[])[1];
        const items = []; const re = /\bt:"([^"]+)"[\s\S]*?\bu:BASE\+"([^"]+)"/g; let m;
        while((m = re.exec(chunk))) items.push({ t:m[1], u:m[2] });
        if(id && name && items.length) out.push({ g:(id==="note"? "作成後記" : g), id, name, color:color||"#5b6672", items });
      });
    });
    const ORD = {"シミュレーション":0, "実験":1, "作成後記":2};
    out.sort((a,b)=>(ORD[a.g]||0)-(ORD[b.g]||0));       // 見出しの順（シミュレーション → 実験 → 作成後記）。同じ見出しの中はトップページの順のまま
    const n = out.reduce((a,s)=>a+s.items.length, 0);
    return (n >= 5)? out : null;               // 取り出しが明らかにおかしいときは写しのまま
  }catch(e){ return null; }
}

  }
}

/* =========================================================================
   デザイン試作の動き（2026-10）
   ・ヒーローのステージ：同じ等速円運動を、外の観測者（慣性系）と一緒に回る観測者（非慣性系）から並べて見せる。
   ・スライドバーの塗り（--p）、タブ列の下の進み具合（--prog）。
   ・画面に見えていないとき・動きを減らす設定のときは動かさない（重くしない：第 21 回の教訓）。
   ========================================================================= */
(function(){
  "use strict";
  const RM = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const MATH = '"KaTeX_Math","KaTeX_Main",serif',
        JP = '"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",YuGothic,"Noto Sans JP",Meiryo,sans-serif';

  /* ===== ヒーローのステージ：同じ等速円運動を「外の観測者」と「一緒に回る観測者」から並べて見せる =====
     左＝慣性系（上から見た台）。小球は回り、張力 S が向心力。遠心力は描かない。
     右＝非慣性系（小球と一緒に回る）。小球は止まって見え、台と外の観測者が逆向きに回る。S と遠心力がつりあう（等長マーク）。 */
  function initStage(){
    const cv = document.getElementById("heroCv"); if(!cv) return;
    const ctx = cv.getContext("2d");
    const K = { S:"#ff6aa8", v:"#5aa7ff", a:"#ffa64d", cf:"#c3ccd6", obsA:"#5aa7ff", obsB:"rgba(243,239,230,.45)" };
    let W=0, H=0, dpr=1, run=false, raf=0, last=0, t=0, paused=false, rate=1;
    const OM = 1.25;
    function setup(){
      const r = cv.getBoundingClientRect(); dpr = Math.min(2, window.devicePixelRatio||1);
      W = Math.max(280, r.width); H = Math.max(170, r.height);
      cv.width = Math.round(W*dpr); cv.height = Math.round(H*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
    }
    function arr(x1,y1,x2,y2,col,lw,dash,dot){
      const dx=x2-x1, dy=y2-y1, L=Math.hypot(dx,dy); if(L<2) return;
      const ux=dx/L, uy=dy/L, h=Math.min(11, L*0.6);
      ctx.save(); ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=lw||2.6; ctx.lineCap="round";
      if(dash) ctx.setLineDash(dash);
      ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2-ux*h*0.8,y2-uy*h*0.8); ctx.stroke(); ctx.setLineDash([]);
      ctx.beginPath(); ctx.moveTo(x2,y2); ctx.lineTo(x2-ux*h-uy*h*0.5,y2-uy*h+ux*h*0.5); ctx.lineTo(x2-ux*h+uy*h*0.5,y2-uy*h-ux*h*0.5); ctx.closePath();
      if(dash){ ctx.fillStyle="#161a20"; ctx.fill(); ctx.lineWidth=1.8; ctx.stroke(); } else ctx.fill();
      if(dot){ ctx.beginPath(); ctx.arc(x1,y1,3,0,7); ctx.fillStyle=col; ctx.fill(); }
      ctx.restore();
      return {ux, uy, L};
    }
    function tick(x,y,ux,uy,n,col){
      ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=2; for(let i=0;i<n;i++){ const d=(i-(n-1)/2)*4.6, cx=x+ux*d, cy=y+uy*d;
        ctx.beginPath(); ctx.moveTo(cx-uy*5.5,cy+ux*5.5); ctx.lineTo(cx+uy*5.5,cy-ux*5.5); ctx.stroke(); } ctx.restore();
    }
    function sym(s,x,y,col,size,sub){
      ctx.save(); ctx.fillStyle=col; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.font="italic "+size+"px "+MATH; ctx.fillText(s,x,y);
      if(sub){ const w=ctx.measureText(s).width; ctx.font=Math.round(size*0.7)+"px "+JP; ctx.textAlign="left"; ctx.fillText(sub,x+w/2+2,y+size*0.15); }
      ctx.restore();
    }
    function stick(x,y,ux,uy,s,col,lw){
      const px=-uy, py=ux, P=(du,dp)=>[x+ux*du*s+px*dp*s, y+uy*du*s+py*dp*s];
      ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=lw; ctx.lineCap="round";
      const hip=P(.38,0), sh=P(.64,0), hd=P(.8,0);
      ctx.beginPath(); ctx.arc(hd[0],hd[1],s*.13,0,7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(hip[0],hip[1]); ctx.lineTo(sh[0],sh[1]); ctx.stroke();
      const f1=P(0,-.17), f2=P(0,.17); ctx.beginPath(); ctx.moveTo(f1[0],f1[1]); ctx.lineTo(hip[0],hip[1]); ctx.lineTo(f2[0],f2[1]); ctx.stroke();
      const e1=P(.5,-.17), e2=P(.5,.17), h1=P(.38,-.12), h2=P(.38,.12);
      ctx.beginPath(); ctx.moveTo(h1[0],h1[1]); ctx.lineTo(e1[0],e1[1]); ctx.lineTo(sh[0],sh[1]); ctx.lineTo(e2[0],e2[1]); ctx.lineTo(h2[0],h2[1]); ctx.stroke();
      ctx.restore();
    }
    function text(s,x,y,col,size,al,bold){ ctx.save(); ctx.fillStyle=col; ctx.font=(bold?"700 ":"600 ")+size+"px "+JP; ctx.textAlign=al||"center"; ctx.textBaseline="middle"; ctx.fillText(s,x,y); ctx.restore(); }

    /* 1 枚ぶん。rot＝一緒に回る観測者から見るか。th＝小球の角（外から見た角） */
    function panel(x0, w, rot, th){
      const narrow = w < 330;
      const cx = x0 + w/2, cy = H*0.5, R = Math.min(w*0.26, H*0.27), rt = R*1.32;
      const view = rot? -th : 0;                         /* 絵全体を −θ 回す（非慣性系）。小球は右に止まる */
      const P = (ang, rr)=>[cx + rr*Math.cos(ang+view), cy - rr*Math.sin(ang+view)];
      /* 地面の方眼（パネル全体）：外から見ると止まっている。一緒に回る観測者から見ると、方眼全体が逆向きに回って見える */
      ctx.save(); ctx.beginPath(); ctx.rect(x0+2, 26, w-4, H-50); ctx.clip();
      ctx.translate(cx,cy); ctx.rotate(-view); ctx.lineWidth=1;
      const gs = R/2.5, ext = Math.hypot(w, H);
      for(let k=-Math.ceil(ext/gs); k<=Math.ceil(ext/gs); k++){ ctx.strokeStyle = (k===0)? "rgba(243,239,230,.26)" : "rgba(243,239,230,.10)";
        ctx.beginPath(); ctx.moveTo(k*gs,-ext); ctx.lineTo(k*gs,ext); ctx.moveTo(-ext,k*gs); ctx.lineTo(ext,k*gs); ctx.stroke(); }
      ctx.restore();
      /* 軌道 */
      ctx.save(); ctx.setLineDash([4,5]); ctx.strokeStyle="rgba(243,239,230,.25)"; ctx.beginPath(); ctx.arc(cx,cy,R,0,7); ctx.stroke(); ctx.restore();
      /* くぎ・糸・小球 */
      const b = P(th, R), rb = Math.max(7, R*0.11), ux = (b[0]-cx)/R, uy = (b[1]-cy)/R;
      ctx.strokeStyle="#c9a77a"; ctx.lineWidth=1.6; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(b[0]-ux*rb, b[1]-uy*rb); ctx.stroke();
      ctx.fillStyle="#f6f2e9"; ctx.beginPath(); ctx.arc(cx,cy,3.2,0,7); ctx.fill();
      const g = ctx.createRadialGradient(b[0]-rb*.35,b[1]-rb*.4,rb*.1,b[0],b[1],rb); g.addColorStop(0,"#fff"); g.addColorStop(.3,"#c9d3de"); g.addColorStop(1,"#56606c");
      ctx.fillStyle=g; ctx.beginPath(); ctx.arc(b[0],b[1],rb,0,7); ctx.fill();
      /* 力の矢印（同じ縮尺）：張力 S は糸のつく点から中心へ */
      const LS = R*0.62;
      const sA = [b[0]-ux*rb, b[1]-uy*rb];
      const aS = arr(sA[0], sA[1], sA[0]-ux*LS, sA[1]-uy*LS, K.S, 3.2, null, true);
      { const lt = [-Math.sin(th+view), -Math.cos(th+view)];      /* 進む向きのがわに書く（うしろがわには a がある） */
        sym("S", sA[0]-ux*LS*0.5 + lt[0]*15, sA[1]-uy*LS*0.5 + lt[1]*15, K.S, 17); }
      if(!rot){
        /* 速度（白抜き・小球の外がわに離して）・加速度（中心向き・うしろへずらす） */
        const tx = -uy, ty = ux;                             /* 画面での進む向き（左回り） */
        const vt = [-Math.sin(th+view), -Math.cos(th+view)];  /* d/dθ of (cos, −sin) */
        const ox = b[0]+ux*(rb+13), oy = b[1]+uy*(rb+13), Lv = R*0.75;
        arr(ox - vt[0]*Lv/2, oy - vt[1]*Lv/2, ox + vt[0]*Lv/2, oy + vt[1]*Lv/2, K.v, 2.6);
        sym("v", ox + vt[0]*(Lv/2+12) + ux*6, oy + vt[1]*(Lv/2+12) + uy*6, K.v, 17);
        const s0 = [b[0]-vt[0]*(rb+8), b[1]-vt[1]*(rb+8)];
        arr(s0[0], s0[1], s0[0]-ux*R*0.5, s0[1]-uy*R*0.5, K.a, 2.8);
        sym("a", s0[0]-ux*R*0.5 - vt[0]*12, s0[1]-uy*R*0.5 - vt[1]*12, K.a, 16);
        void tx; void ty;
      } else {
        /* 遠心力（見かけの力・破線）：作用点は小球の中心。S と同じ長さ → 等長マーク */
        arr(b[0], b[1], b[0]+ux*LS, b[1]+uy*LS, K.cf, 2.6, [6,4], true);
        text("遠心力", b[0]+ux*(LS+4), b[1]+uy*(LS+4) - 16, K.cf, narrow? 11 : 12.5, "center", true);
        const p1 = Math.min(LS*0.42, LS-13);
        tick(sA[0]-ux*p1, sA[1]-uy*p1, -ux, -uy, 1, K.S);
        tick(b[0]+ux*p1, b[1]+uy*p1, ux, uy, 1, K.cf);
      }
      /* 観測者：外の観測者は台の外（下）。非慣性系では回って見える */
      /* 頭の向き：外の観測者は「画面の上」（非慣性系では絵といっしょに回る）、一緒に回る観測者は「小球の角 + 90°」（非慣性系では画面の上） */
      const sz = narrow? 26 : 34;
      const oA = P(Math.PI*1.18, rt + 8), upA = [Math.cos(Math.PI/2+view), -Math.sin(Math.PI/2+view)];
      stick(oA[0], oA[1], upA[0], upA[1], sz, rot? K.obsB : K.obsA, rot? 1.6 : 2.4);
      /* 一緒に回る観測者：台の上、軌道のすぐ外・小球のうしろ。名前は足もとの下（矢印と重ならない） */
      const oB = P(th - 0.66, R*1.2), upB = [Math.cos(th+Math.PI/2+view), -Math.sin(th+Math.PI/2+view)];
      stick(oB[0], oB[1], upB[0], upB[1], sz*0.8, rot? K.obsA : K.obsB, rot? 2.4 : 1.6);
      if(!narrow){
        text("外の観測者", oA[0]-upA[0]*12, oA[1]-upA[1]*12, rot? "rgba(243,239,230,.45)" : K.obsA, 10.5, "center", !rot);
        text("一緒に回る観測者", oB[0]-upB[0]*12, oB[1]-upB[1]*12, rot? K.obsA : "rgba(243,239,230,.45)", 10.5, "center", rot);
      }
      /* 見出し（せまい画面では短く） */
      const T1 = narrow? (rot? "一緒に回る（非慣性系）" : "外から（慣性系）") : (rot? "一緒に回る観測者（非慣性系）から見る" : "外の観測者（慣性系）から見る");
      const T2 = narrow? (rot? "S と遠心力がつりあう" : "S が向心力") : (rot? "小球は止まって見える：S と遠心力がつりあう" : "小球は回り続ける：S が向心力（遠心力はない）");
      text(T1, cx, 16, "#f6f2e9", narrow? 11 : 13.5, "center", true);
      text(T2, cx, H-12, "rgba(243,239,230,.62)", narrow? 10 : 12, "center");
    }
    function draw(tt){
      ctx.clearRect(0,0,W,H);
      const th = OM*tt + 0.6, half = W/2;
      panel(0, half, false, th);
      ctx.save(); ctx.strokeStyle="rgba(255,255,255,.09)"; ctx.beginPath(); ctx.moveTo(half+.5, 10); ctx.lineTo(half+.5, H-10); ctx.stroke(); ctx.restore();
      panel(half, half, true, th);
    }
    function frame(ts){
      if(!run) return;
      const dtm = last? Math.min(0.05,(ts-last)/1000) : 0; last = ts;
      t += dtm*rate; draw(t);
      raf = requestAnimationFrame(frame);
    }
    function start(){ if(run || RM || paused) return; run = true; last = 0; raf = requestAnimationFrame(frame); }
    function stop(){ run = false; cancelAnimationFrame(raf); }
    setup(); draw(0);
    window.__hero = { frame:(tt)=>{ stop(); draw(tt); }, start, stop };
    let rz = 0; window.addEventListener("resize", ()=>{ clearTimeout(rz); rz = setTimeout(()=>{ setup(); draw(t); }, 120); });
    if("IntersectionObserver" in window){
      new IntersectionObserver((es)=>{ es.forEach(en=>{ (en.isIntersecting && !document.hidden)? start() : stop(); }); }, {threshold:0.05}).observe(cv);
    } else start();
    document.addEventListener("visibilitychange", ()=>{ if(document.hidden) stop(); else { const r=cv.getBoundingClientRect(); if(r.bottom>0 && r.top<innerHeight) start(); } });
    const ctl = document.querySelector("#hero .stagectl");
    if(ctl){
      const pp = ctl.querySelector(".pp"), sl = ctl.querySelector(".slow");
      if(sl){ if(RM) sl.hidden = true;
        sl.addEventListener("click", ()=>{ rate = (rate===1? 0.3 : 1); sl.setAttribute("aria-pressed", rate<1? "true" : "false"); }); }
      if(pp){ if(RM){ pp.hidden = true; }
        pp.addEventListener("click", ()=>{ paused = !paused; pp.classList.toggle("paused", paused); pp.setAttribute("aria-label", paused? "再生" : "一時停止");
          if(paused){ stop(); draw(t); } else { start(); } }); }
    }
    /* 図の再生を始めたら止める（同時に動くのは 1 つだけ） */
    document.addEventListener("click", (ev)=>{ if(ev.target.closest && ev.target.closest("button.b.play")) stop(); }, true);
  }

  /* スライドバーの塗り：値が変わったら --p を書きかえる（プログラムから値を入れたときも、軽い見回りで拾う） */
  function syncRange(el){ const mn = parseFloat(el.min)||0, mx = parseFloat(el.max), v = parseFloat(el.value);
    const p = (isFinite(mx) && mx>mn)? (v-mn)/(mx-mn)*100 : 0; const s = p.toFixed(1)+"%";
    if(el._p !== s){ el._p = s; el.style.setProperty("--p", s); } }
  function initRanges(){
    document.addEventListener("input", (ev)=>{ if(ev.target && ev.target.type === "range") syncRange(ev.target); }, true);
    const sweep = ()=>{ if(document.hidden) return; document.querySelectorAll(".mode.on input[type=range], .modebar input[type=range]").forEach(syncRange); alignTicks(); };
    sweep(); setInterval(sweep, 120);
  }

  /* スライドバーの下の目盛りの文字（e=0・e=0.5・e=1）を、つまみの位置にきっちり合わせる（第 29 回）
     文字の列を「左右の余白」で合わせていたので、ラベルやボタンの幅が変わるとずれていた。
     スライドバーの実際の位置と幅を測り、つまみの中心が来る位置に 1 つずつ置く（等間隔の目盛りとして） */
  function alignTicks(){
    document.querySelectorAll(".mode.on .vrow.ticks, .modebar .vrow.ticks").forEach(tr=>{
      let row = tr.previousElementSibling; while(row && !row.querySelector("input[type=range]")) row = row.previousElementSibling;
      const inp = row && row.querySelector("input[type=range]"); if(!inp) return;
      const ri = inp.getBoundingClientRect(); if(ri.width < 10) return;
      tr.classList.add("tk-on");
      const rt = tr.getBoundingClientRect(), TH = 9, sp = tr.children, n = sp.length;
      const key = Math.round(ri.left - rt.left)+":"+Math.round(ri.width); if(tr._tk === key) return; tr._tk = key;
      for(let i=0; i<n; i++){ const f = n>1? i/(n-1) : 0.5; sp[i].style.left = (ri.left - rt.left + TH + f*(ri.width - 2*TH)).toFixed(1)+"px"; }
    });
  }
  window.addEventListener("resize", ()=>{ document.querySelectorAll(".vrow.ticks").forEach(t=>{ t._tk = null; }); alignTicks(); });

  /* タブ列の下の進み具合 */
  function initProgress(){
    const nav = document.getElementById("tabs"); if(!nav) return;
    let pend = false;
    const upd = ()=>{ pend = false; const h = document.documentElement, max = h.scrollHeight - innerHeight;
      nav.style.setProperty("--prog", max>0? Math.min(1, Math.max(0, scrollY/max)).toFixed(4) : 0); };
    window.addEventListener("scroll", ()=>{ if(!pend){ pend = true; requestAnimationFrame(upd); } }, {passive:true});
    window.addEventListener("resize", upd); upd();
  }

  /* ヒーローの 3 つの要点：その章を開いて、本文の頭までスクロール */
  function initIdeas(){
    document.querySelectorAll("#hero .ideas a").forEach(a=>{
      a.addEventListener("click", (ev)=>{ ev.preventDefault(); const id = a.getAttribute("href").slice(1);
        if(typeof activateMode === "function") activateMode(id);
        history.replaceState(null, "", "#"+id);
        window.scrollTo({top: (typeof contentTop === "function"? contentTop() : 0), behavior:"auto"}); });
    });
  }

  /* 「■ 見出し」の ■ を、色のついた小さな四角にする（文字の■は環境で形がばらつく） */
  function decorate(root){
    if(!root) return;
    root.querySelectorAll(".gtitle span, .stagetitle, .ttl, .mt").forEach(el=>{
      if(el.dataset.sq) return; const n = el.firstChild;
      if(n && n.nodeType === 3 && /^\s*■\s*/.test(n.nodeValue)){ n.nodeValue = n.nodeValue.replace(/^\s*■\s*/, ""); const i = document.createElement("i"); i.className = "sq"; i.setAttribute("aria-hidden","true"); el.insertBefore(i, n); }
      el.dataset.sq = "1";
    });
  }
  function initDecorate(){
    if(typeof activateMode !== "function") return;
    const orig = activateMode;
    const showTab = ()=>{ const row = document.querySelector("#tabs .tabs-in"), on = row && row.querySelector(".tab.on"); if(!on || row.scrollWidth <= row.clientWidth) return;
      const l = on.offsetLeft - 24, r = on.offsetLeft + on.offsetWidth + 24;
      if(l < row.scrollLeft) row.scrollLeft = l; else if(r > row.scrollLeft + row.clientWidth) row.scrollLeft = r - row.clientWidth; };   // スマホ：選んだタブが見えるように横に送る
    const cur = ()=>document.querySelectorAll("#tabs .tab").forEach(b=>{ if(b.classList.contains("on")) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
    activateMode = function(id){ const r = orig.apply(this, arguments); decorate(document.getElementById(id)); showTab(); cur(); return r; };   // 章を開いたあと（シムは初めて開いたときに作られる）
    showTab(); cur();
    document.querySelectorAll(".mode.on").forEach(decorate);
  }
  /* タブ列：ヒーローを過ぎたら .stuck */
  function initStuck(){
    const hero = document.getElementById("hero"), nav = document.getElementById("tabs"); if(!hero || !nav || !("IntersectionObserver" in window)) return;
    new IntersectionObserver((es)=>{ es.forEach(en=>nav.classList.toggle("stuck", !en.isIntersecting)); }, {threshold:0}).observe(hero);
    const nb = nav.querySelector(".navbrand"); if(nb) nb.addEventListener("click", (ev)=>{ ev.preventDefault(); window.scrollTo({top:0, behavior:"auto"}); });
  }
  /* フッター：題名と章の目次 */
  function initFooter(){
    const f = document.querySelector("#wrap footer") || document.querySelector("body > footer"); if(!f) return;
    document.body.appendChild(f);
    const C = "①②③④⑤⑥⑦⑧⑨";
    const items = (typeof MODES !== "undefined"? MODES : []).map((m,i)=>'<li><a href="#'+m.id+'" data-mode="'+m.id+'"><b>'+C[i]+'</b>'+m.name+'</a></li>').join("");
    f.innerHTML = '<div class="ft-in"><p class="ft-mark">Circular Motion<span>円運動 〜外から見るか、一緒に回って見るか〜</span></p>'+
      '<ul class="ft-nav">'+items+'</ul>'+
      '<div class="ft-base"><span><a class="ft-home" href="'+SITE_HOME+'">⌂ 楽楽（らくらく）高校物理 トップページ</a>　／　高校物理 ・ 力学</span><span class="ft-r"><button type="button" class="ft-pages">ほかのページ一覧</button><a href="#top" class="ft-top">▲ ページの一番上へ</a></span></div></div>';
    f.querySelectorAll("a[data-mode]").forEach(a=>a.addEventListener("click", (ev)=>{ ev.preventDefault(); const id = a.dataset.mode;
      activateMode(id); history.replaceState(null, "", "#"+id); window.scrollTo({top:(typeof contentTop==="function"? contentTop() : 0), behavior:"auto"}); }));
    const fp = f.querySelector(".ft-pages"); if(fp) fp.addEventListener("click", ()=>{ if(window.SITENAV) window.SITENAV.open(); });
    const tp = f.querySelector(".ft-top"); if(tp) tp.addEventListener("click", (ev)=>{ ev.preventDefault(); window.scrollTo({top:0, behavior:"auto"}); });
  }

  document.addEventListener("DOMContentLoaded", ()=>{
    initFooter(); initDecorate(); initStage(); initRanges(); initProgress(); initIdeas(); initStuck();
  });
})();
